<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Zappride Phase 1 Simulator</title><style>body{font-family:Arial;background:#f4f7f6;color:#173330;padding:24px}main{max-width:900px;margin:auto}.c{background:white;border:1px solid #dde7e4;border-radius:14px;padding:18px;margin:12px 0}button{padding:10px 13px;margin:4px;border:0;border-radius:9px;background:#0f766e;color:white;font-weight:bold}pre{background:#102f2c;color:#d9f3ee;padding:14px;border-radius:10px;overflow:auto}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g div{background:#f1f6f4;padding:10px;border-radius:9px}.g b{display:block;font-size:18px}@media(max-width:700px){.g{grid-template-columns:1fr 1fr}}</style></head>
<body><main><div class="c"><h1>Zappride Integrated Simulation</h1><p>ZP-BK-1001 → ZP-EV-014 → TR-2408</p><button onclick="ZapprideSim.verify()">Verify customer</button><button onclick="ZapprideSim.start()">Start trip</button><button onclick="ZapprideSim.complete()">Complete now</button><button onclick="ZapprideSim.reset()">Reset</button></div><div class="c"><div class="g" id="g"></div></div><div class="c"><pre id="p"></pre></div></main><script src="../shared/zappride-sim.js"></script><script>
function draw(){let s=ZapprideSim.load();let a=[['Booking',s.booking.status],['Trip',s.trip.status],['Progress',s.trip.progressPct+'%'],['Vehicle',s.vehicle.status],['Battery',s.vehicle.battery+'%'],['Telemetry',s.telemetry.eventRatePerMin+'/min'],['Payment',s.payment.status],['Investor','₹'+s.investor.tripEarning]];g.innerHTML=a.map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('');p.textContent=JSON.stringify(s,null,2)}setInterval(()=>{ZapprideSim.tick();draw()},2000);draw();</script></body></html>
